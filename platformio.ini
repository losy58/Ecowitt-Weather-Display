; PlatformIO-beállítás: ugyanaz a kód, mint az Arduino IDE-ben, de saját ESP-IDF beállításokkal (custom_sdkconfig).
; Fordítás:  pio run        Feltöltés USB-n:  pio run -t upload        OTA: a .pio/build/idojaras/firmware.bin a http://idojaras.local/ oldalon
; Az Arduino IDE továbbra is használható ugyanebből a mappából.

[platformio]
src_dir = .
default_envs = idojaras

[env:idojaras]
; Arduino-ESP32 3.3.12 (ESP-IDF 5.5.5) - ugyanaz a verzió, mint az Arduino IDE-ben
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.variant = waveshare_esp32_s3_touch_lcd_7
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv      ; = Arduino IDE "16M Flash (3MB APP/9.9MB FATFS)"; ne változtasd, különben az OTA és az előzmények elvesznek

build_src_filter = -<*> +<*.ino> +<*.ino.cpp> +<wifi_manager.cpp> +<font_*.c>   ; csak a sketch saját fájljai (a gyökérben a PlatformIO generált mappái is ott vannak)
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DLV_CONF_INCLUDE_SIMPLE
  -I"${PROJECT_DIR}"   ; idézőjelben: Windowson a backslash-es útvonalból különben eltűnnének a "\" jelek

; a könyvtárakat a PlatformIO tölti le (rögzített verzió; a beállítás: lv_conf.h a projekt gyökerében)
lib_deps =
  lvgl/lvgl@9.6.0
lib_ldf_mode = chain

; A képcsúszás végleges javítása: flash-írás alatt is fusson a kijelző.
;  XIP_FROM_PSRAM: a program kódja és konstansai a PSRAM-ból futnak, így a flash-írás nem állítja le a PSRAM-ot (a képpuffert)
;  LCD_RGB_ISR_IRAM_SAFE: a kijelző (bounce buffer) megszakítása flash-írás alatt is fut
;  MBEDTLS_EXTERNAL_MEM_ALLOC: a HTTPS (előrejelzés) memóriája a PSRAM-ból, nem a szűkös belső RAM-ból
custom_sdkconfig =
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y

monitor_speed = 115200

; Guition JC8012P4A1C (ESP32-P4, 10,1" 800x1280 MIPI-DSI kijelző, GSL3680 érintés, WiFi az ESP32-C6-on át)
; Fordítás:  pio run -e idojaras_p4        Feltöltés USB-n:  pio run -e idojaras_p4 -t upload
; A felület 1280x800-as (a 7B méretei az SX/SY/S makrókkal nagyítva, kijelzo.h); a kijelzőkezelés és a nagyobb fontok
; (ugyanazzal a névvel, 1,25-szörös méretben) a p4/ mappában (az Arduino IDE ezt nem fordítja).
; A MIPI-DSI kijelzőnek saját képpuffere van, a flash-írás nem csúsztatja el a képet (a custom_sdkconfig lent: kék villanás).
[env:idojaras_p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-p4_r3                           ; a lapon v3.2-es chip van
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv

build_src_filter = -<*> +<*.ino> +<*.ino.cpp> +<wifi_manager.cpp> +<p4/*.c>   ; a fontok is a p4/-ből
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1   ; a soros napló a lap natív USB-portján (USB-Serial-JTAG)
  -DLV_CONF_INCLUDE_SIMPLE
  -I"${PROJECT_DIR}"
  -I"${PROJECT_DIR}/p4"

; LCD_DSI_ISR_CACHE_SAFE: a képkockákat adagoló DSI-megszakítás flash-írás (előzménymentés, OTA) alatt is fut; nélküle
; ilyenkor a kép egy pillanatra világoskék lett. A custom_sdkconfig miatt a keretrendszer újrafordul, és közben a
; legújabb esp_hosted / esp_wifi_remote kerülne be, ami nem illik a WiFi-chip (ESP32-C6) programjához: a WiFi nem
; indul (esp_wifi_init 0x102). Ezért a kettő a gyári keretrendszerével azonos verzióra rögzítve, a projekt saját
; .dummy/idf_component.yml-ben (ez a hibrid fordítás fő komponense; a custom_component_remove/add erre nem jó: a kivett
; komponens fejléceit törli). LCD_DSI_ISR_HANDLER_IN_IRAM: a CACHE_SAFE amúgy is bekapcsolja.
; CAM_CTLR_MIPI_CSI_ISR_CACHE_SAFE: a kamera (p4/kamera_p4.c) CSI-meghajtója így a belső RAM-ba foglal; enélkül a
; GDMA (DW_GDMA_ISR_IRAM_SAFE) elutasítja ("user context not in internal RAM"), és a kamera nem indul.
custom_sdkconfig =
  CONFIG_LCD_DSI_ISR_CACHE_SAFE=y
  CONFIG_LCD_DSI_ISR_HANDLER_IN_IRAM=y
  CONFIG_CAM_CTLR_MIPI_CSI_ISR_CACHE_SAFE=y

; a könyvtárakat a PlatformIO tölti le (rögzített verzió; a beállítás: lv_conf.h a projekt gyökerében)
lib_deps =
  lvgl/lvgl@9.6.0
lib_ldf_mode = chain

monitor_speed = 115200
